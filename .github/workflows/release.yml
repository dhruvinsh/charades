name: Release — Build & Push to GHCR

on:
  push:
    tags:
      - "v*"   # triggers on v1.0.0, v2.1.3-rc1, etc.

permissions:
  contents: write        # create GitHub releases
  packages: write        # push to GHCR

jobs:
  # ── Build & push single Docker image ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dhruvinsh/charades
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=charades
          cache-to: type=gha,mode=max,scope=charades
          platforms: linux/amd64,linux/arm64

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for changelog generation

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Charades ${{ github.ref_name }}"
          body: |
            ## Charades ${{ github.ref_name }}

            ### Docker Image
            ```
            docker pull ghcr.io/dhruvinsh/charades:${{ github.ref_name }}
            ```

            ### Quick Start
            ```bash
            # Clone + configure
            git clone https://github.com/dhruvinsh/charades.git
            cd charades
            cp .env.example .env
            # Edit .env to add your TMDB_API_KEY

            # Run
            docker compose up -d
            # Open http://localhost:5000
            ```

            ### Changes
            ${{ steps.changelog.outputs.CHANGES }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
