# Optional .env vars: SECRET_KEY, TMDB_API_KEY, OPENAI_API_KEY, OPENAI_MODEL (gpt-4.1-mini).
# Keys in .env are used when the client does not send X-TMDB-Key / X-OpenAI-Key.
services:
  charades:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
