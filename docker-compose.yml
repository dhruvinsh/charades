services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - charades_net
    # No exposed ports — only accessible via nginx

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - charades_net

networks:
  charades_net:
    driver: bridge
